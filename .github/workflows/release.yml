name: App Release

on:
  push:
    branches:
      - main
      - vk/**
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifact (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.runs_on || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: trekr-linux-x86_64
            archive_name: trekr-linux-x86_64.tar.gz
            package_command: tar -czf trekr-linux-x86_64.tar.gz -C target/release trekr
          - os: ubuntu-latest
            artifact_name: trekr-linux-aarch64
            archive_name: trekr-linux-aarch64.tar.gz
            runs_on: ubuntu-24.04-arm
            package_command: tar -czf trekr-linux-aarch64.tar.gz -C target/release trekr
          - os: macos-latest
            artifact_name: trekr-macos
            archive_name: trekr-macos.tar.gz
            package_command: ""
          - os: windows-latest
            artifact_name: trekr-windows-x86_64
            archive_name: trekr-windows-x86_64.zip
            package_command: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxfixes-dev \
            libxss-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libdbus-1-dev \
            libibus-1.0-dev \
            libudev-dev \
            libdrm-dev \
            libgbm-dev

      - name: Build
        run: cargo build --release --bin trekr

      - name: Package artifact (Unix)
        if: runner.os == 'Linux'
        run: ${{ matrix.package_command }}

      - name: Package artifact (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          STAGE_DIR="target/release/trekr-macos"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR/lib"
          cp "target/release/trekr" "$STAGE_DIR/trekr"
          chmod +x "$STAGE_DIR/trekr"

          SDL_DYLIBS=()
          while IFS= read -r dylib; do
            SDL_DYLIBS+=("$dylib")
          done < <(find target/release target/release/deps -type f -name 'libSDL3*.dylib' 2>/dev/null | sort -u)
          if [ "${#SDL_DYLIBS[@]}" -eq 0 ]; then
            echo "Could not locate SDL3 runtime dylibs in release output."
            exit 1
          fi

          for dylib in "${SDL_DYLIBS[@]}"; do
            cp "$dylib" "$STAGE_DIR/lib/"
          done

          cat > "$STAGE_DIR/run-trekr.sh" << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          HERE="$(cd "$(dirname "$0")" && pwd)"
          export DYLD_LIBRARY_PATH="$HERE/lib:${DYLD_LIBRARY_PATH:-}"
          exec "$HERE/trekr" "$@"
          EOF
          chmod +x "$STAGE_DIR/run-trekr.sh"

          tar -czf "trekr-macos.tar.gz" -C "target/release" "trekr-macos"

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stageDir = "target/release/trekr-windows-x86_64"
          if (Test-Path $stageDir) {
            Remove-Item -Recurse -Force $stageDir
          }
          New-Item -ItemType Directory -Path $stageDir | Out-Null
          Copy-Item "target/release/trekr.exe" -Destination $stageDir -Force

          $sdlDlls = Get-ChildItem -Path "target/release", "target/release/deps" -Filter "SDL3*.dll" -File -Recurse -ErrorAction SilentlyContinue |
            Sort-Object FullName -Unique
          if (-not $sdlDlls -or $sdlDlls.Count -eq 0) {
            throw "Could not locate SDL3 runtime DLLs in release output."
          }

          foreach ($dll in $sdlDlls) {
            Copy-Item $dll.FullName -Destination $stageDir -Force
          }

          Compress-Archive -Path "$stageDir/*" -DestinationPath "trekr-windows-x86_64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
          path: ${{ matrix.archive_name }}
          retention-days: 14

  publish:
    name: Publish app GitHub release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"
            echo "release_name=Release ${TAG}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=app-${GITHUB_REF_NAME}-${GITHUB_RUN_NUMBER}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "release_name=App build ${GITHUB_REF_NAME} #${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/trekr-linux-x86_64-${{ github.sha }}/trekr-linux-x86_64.tar.gz
            dist/trekr-linux-aarch64-${{ github.sha }}/trekr-linux-aarch64.tar.gz
            dist/trekr-macos-${{ github.sha }}/trekr-macos.tar.gz
            dist/trekr-windows-x86_64-${{ github.sha }}/trekr-windows-x86_64.zip

  publish-pr-preview:
    name: Publish PR preview release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create or update PR preview release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pr-${{ github.event.pull_request.number }}-latest
          name: PR #${{ github.event.pull_request.number }} preview (latest)
          prerelease: true
          generate_release_notes: false
          target_commitish: ${{ github.event.pull_request.head.sha }}
          overwrite_files: true
          files: |
            dist/trekr-linux-x86_64-pr-${{ github.event.pull_request.number }}/trekr-linux-x86_64.tar.gz
            dist/trekr-linux-aarch64-pr-${{ github.event.pull_request.number }}/trekr-linux-aarch64.tar.gz
            dist/trekr-macos-pr-${{ github.event.pull_request.number }}/trekr-macos.tar.gz
            dist/trekr-windows-x86_64-pr-${{ github.event.pull_request.number }}/trekr-windows-x86_64.zip
