name: Launcher Catalog

on:
  workflow_run:
    workflows:
      - App Release
      - Launcher Release
    types:
      - completed
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: launcher-catalog
  cancel-in-progress: false

jobs:
  publish-catalog:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Build launcher catalog JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - << 'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone

          token = os.environ["GITHUB_TOKEN"].strip()
          owner_repo = os.environ["GITHUB_REPOSITORY"].strip()
          owner, repo = owner_repo.split("/", 1)

          base = f"https://api.github.com/repos/{owner}/{repo}"
          headers = {
              "User-Agent": "trekr-launcher-catalog",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Authorization": f"Bearer {token}",
          }

          def api_get(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return json.loads(resp.read().decode("utf-8"))

          branches_payload = api_get(f"{base}/branches?per_page=100")
          branches = sorted({entry.get("name", "") for entry in branches_payload if entry.get("name")})

          ahead_by_main = {}
          for branch in branches:
              if branch.lower() == "main":
                  ahead_by_main[branch] = 1
                  continue
              encoded = urllib.parse.quote(branch, safe="")
              try:
                  compare = api_get(f"{base}/compare/main...{encoded}")
                  ahead_by_main[branch] = int(compare.get("ahead_by", 0))
              except urllib.error.HTTPError:
                  continue

          pulls = api_get(f"{base}/pulls?state=open&per_page=100")
          pr_titles = {}
          for pull in pulls:
              head = pull.get("head") or {}
              ref = head.get("ref")
              title = pull.get("title")
              if ref and title:
                  pr_titles[ref] = title

          releases = api_get(f"{base}/releases?per_page=100")
          latest_release_tags = {}
          download_urls = {}

          def release_tag_branch(tag):
              if not tag.startswith("app-"):
                  return None
              rest = tag[len("app-"):]
              left, _, sha = rest.rpartition("-")
              if len(sha) != 40 or any(ch not in "0123456789abcdefABCDEF" for ch in sha):
                  return None
              branch, _, run = left.rpartition("-")
              if not run.isdigit() or not branch:
                  return None
              return branch

          for release in releases:
              if release.get("draft"):
                  continue
              tag = release.get("tag_name", "")
              branch = release_tag_branch(tag)
              if branch and branch not in latest_release_tags:
                  latest_release_tags[branch] = tag
                  urls = {}
                  for asset in release.get("assets", []):
                      name = (asset.get("name") or "").lower()
                      url = asset.get("browser_download_url")
                      if not url:
                          continue
                      if "windows" in name:
                          urls["windows-x86_64"] = url
                      elif "linux-aarch64" in name or "aarch64" in name or "arm64" in name:
                          urls["linux-aarch64"] = url
                      elif "macos" in name or "darwin" in name:
                          urls["macos"] = url
                      elif "linux" in name:
                          urls["linux-x86_64"] = url
                  download_urls[branch] = urls

          payload = {
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "repository": owner_repo,
              "branches": branches,
              "ahead_by_main": ahead_by_main,
              "pr_titles": pr_titles,
              "latest_release_tags": latest_release_tags,
              "download_urls": download_urls,
          }
          with open("launcher-catalog.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2, sort_keys=True)
          PY

      - name: Publish catalog release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: launcher-catalog-latest
          name: Launcher catalog (latest)
          prerelease: true
          generate_release_notes: false
          overwrite_files: true
          files: launcher-catalog.json
